<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TradeMLM - Trading Course & MLM Platform">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TradeMLM">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>TradeMLM</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0e1a">
  <style>
    body {
      margin: 0;
      background-color: #0a0e1a;
    }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #0a0e1a;
    }
    .loading-logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #00d2ff, #7b2ff7);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }
    .loading-text {
      color: #00d2ff;
      font-family: sans-serif;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .loading-sub {
      color: #8899aa;
      font-family: sans-serif;
      font-size: 14px;
      margin-top: 8px;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(0, 210, 255, 0.3); }
      50% { box-shadow: 0 0 40px rgba(0, 210, 255, 0.7); }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loading-logo">📈</div>
    <div class="loading-text">TradeMLM</div>
    <div class="loading-sub">Loading...</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      document.getElementById('loading').style.display = 'none';
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
