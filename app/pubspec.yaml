name: trading_mlm_app
description: Trading Course MLM App - Modern Trading Education Platform

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^13.0.0
  
  # HTTP & API
  dio: ^5.4.0
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.2
  
  # Fonts & UI
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  
  # Charts
  fl_chart: ^0.66.1
  
  # Animations
  animate_do: ^3.3.4
  
  # QR Code (for crypto payment)
  qr_flutter: ^4.1.0
  
  # WebView (for payment)
  webview_flutter: ^4.4.2
  
  # URL Launcher
  url_launcher: ^6.2.4
  
  # Image Picker
  image_picker: ^1.0.7
  
  # Notifications
  flutter_local_notifications: ^16.3.0
  
  # Icons
  cupertino_icons: ^1.0.2
  font_awesome_flutter: ^10.7.0
  
  # Connectivity
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
